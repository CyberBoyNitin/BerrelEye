<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">BerrelEye architecture</title>
  <desc id="archDesc">OpenAI-compatible clients call the Go gateway, which applies auth, policy, PII tokenization, caching, and capability-aware routing before calling a provider. The gateway persists telemetry to Postgres, coordinates rate limits and cache in Redis, and optionally calls the ML service. The Next.js dashboard reads the gateway through a session-authenticated API.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0a0a0a"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/>
    </marker>
  </defs>

  <rect width="1200" height="640" rx="16" fill="#fafafa"/>
  <rect x="1" y="1" width="1198" height="638" rx="16" fill="none" stroke="#e5e5e5"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="40" y="56" font-size="26" font-weight="650" fill="#0a0a0a">BerrelEye request path</text>
    <text x="40" y="82" font-size="14" fill="#666666">One OpenAI-compatible endpoint. Routing, security, caching, and cost accounting in the middle.</text>

    <!-- Client -->
    <rect x="40" y="150" width="150" height="110" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="60" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2" fill="#999999">CLIENT</text>
    <text x="60" y="204" font-size="14" fill="#0a0a0a">OpenAI SDK</text>
    <text x="60" y="224" font-size="13" fill="#666666">or curl</text>

    <line x1="190" y1="205" x2="245" y2="205" stroke="#0a0a0a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Gateway -->
    <rect x="245" y="120" width="565" height="235" rx="14" fill="#ffffff" stroke="#d4d4d4"/>
    <text x="269" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2" fill="#888888">GATEWAY :8080</text>
    <text x="269" y="174" font-size="18" font-weight="600" fill="#0a0a0a">OpenAI-compatible edge</text>

    <!-- Stages -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <rect x="269" y="195" width="165" height="46" rx="9" fill="#f6f6f5" stroke="#e5e5e5"/>
      <text x="281" y="212" font-size="9" fill="#999999">01</text>
      <text x="281" y="230" font-size="11" fill="#0a0a0a">Auth &amp; API keys</text>

      <rect x="444" y="195" width="165" height="46" rx="9" fill="#f6f6f5" stroke="#e5e5e5"/>
      <text x="456" y="212" font-size="9" fill="#999999">02</text>
      <text x="456" y="230" font-size="11" fill="#0a0a0a">Policy &amp; budgets</text>

      <rect x="619" y="195" width="165" height="46" rx="9" fill="#f6f6f5" stroke="#e5e5e5"/>
      <text x="631" y="212" font-size="9" fill="#999999">03</text>
      <text x="631" y="230" font-size="11" fill="#0a0a0a">PII tokenize</text>

      <rect x="269" y="252" width="165" height="46" rx="9" fill="#f6f6f5" stroke="#e5e5e5"/>
      <text x="281" y="269" font-size="9" fill="#999999">04</text>
      <text x="281" y="287" font-size="11" fill="#0a0a0a">Exact / semantic cache</text>

      <rect x="444" y="252" width="165" height="46" rx="9" fill="#f6f6f5" stroke="#e5e5e5"/>
      <text x="456" y="269" font-size="9" fill="#999999">05</text>
      <text x="456" y="287" font-size="11" fill="#0a0a0a">Capability router</text>

      <rect x="619" y="252" width="165" height="46" rx="9" fill="#f6f6f5" stroke="#e5e5e5"/>
      <text x="631" y="269" font-size="9" fill="#999999">06</text>
      <text x="631" y="287" font-size="11" fill="#0a0a0a">Provider exec</text>
    </g>
    <text x="269" y="334" font-size="11" fill="#777777">Every decision recorded: mode, reasons, attempts, tokens, and cost.</text>

    <line x1="810" y1="205" x2="875" y2="205" stroke="#0a0a0a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Providers -->
    <rect x="875" y="120" width="285" height="235" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="899" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2" fill="#888888">PROVIDERS</text>
    <text x="899" y="174" font-size="16" font-weight="600" fill="#0a0a0a">Upstream APIs</text>
    <g font-size="12" fill="#0a0a0a">
      <rect x="899" y="192" width="237" height="32" rx="7" fill="#f6f6f5"/>
      <circle cx="915" cy="208" r="3.5" fill="#0a0a0a"/>
      <text x="928" y="212">OpenAI</text>

      <rect x="899" y="230" width="237" height="32" rx="7" fill="#f6f6f5"/>
      <circle cx="915" cy="246" r="3.5" fill="#0a0a0a"/>
      <text x="928" y="250">Anthropic</text>

      <rect x="899" y="268" width="237" height="32" rx="7" fill="#f6f6f5"/>
      <circle cx="915" cy="284" r="3.5" fill="#9a9a9a"/>
      <text x="928" y="288">OpenAI-compatible</text>

      <rect x="899" y="306" width="237" height="32" rx="7" fill="#f6f6f5"/>
      <circle cx="915" cy="322" r="3.5" fill="#bdbdbd"/>
      <text x="928" y="326" fill="#666666">Mock (local testing)</text>
    </g>

    <!-- Telemetry bus -->
    <path d="M 527 355 V 392" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 335 392 H 745" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 335 392 V 425" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowMuted)"/>
    <path d="M 540 392 V 425" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowMuted)"/>
    <path d="M 745 392 V 425" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowMuted)"/>
    <text x="559" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#888888">telemetry</text>

    <!-- Data stores -->
    <rect x="245" y="425" width="180" height="110" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="263" y="451" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2" fill="#888888">POSTGRES</text>
    <text x="263" y="477" font-size="12" fill="#0a0a0a">Requests · routing</text>
    <text x="263" y="497" font-size="12" fill="#0a0a0a">Costs · audit</text>
    <text x="263" y="517" font-size="11" fill="#888888">source of truth</text>

    <rect x="450" y="425" width="180" height="110" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="468" y="451" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2" fill="#888888">REDIS</text>
    <text x="468" y="477" font-size="12" fill="#0a0a0a">Rate limits</text>
    <text x="468" y="497" font-size="12" fill="#0a0a0a">Exact cache</text>
    <text x="468" y="517" font-size="11" fill="#888888">optional in local dev</text>

    <rect x="655" y="425" width="180" height="110" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="673" y="451" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2" fill="#888888">ML SERVICE :8001</text>
    <text x="673" y="477" font-size="12" fill="#0a0a0a">PII · embeddings</text>
    <text x="673" y="497" font-size="12" fill="#0a0a0a">Classifier</text>
    <text x="673" y="517" font-size="11" fill="#888888">optional enhancement</text>

    <!-- Dashboard -->
    <rect x="875" y="425" width="285" height="110" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="899" y="451" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2" fill="#888888">DASHBOARD :3000</text>
    <text x="899" y="477" font-size="13" fill="#0a0a0a">Next.js · session cookie</text>
    <text x="899" y="499" font-size="12" fill="#666666">Reads /api/* — secrets never reach the browser</text>

    <path d="M 875 480 H 825 V 355" fill="none" stroke="#0a0a0a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="833" y="472" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#888888">session API</text>

    <!-- Legend -->
    <line x1="40" y1="590" x2="72" y2="590" stroke="#0a0a0a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="82" y="594" font-size="12" fill="#666666">request path</text>
    <line x1="190" y1="590" x2="222" y2="590" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowMuted)"/>
    <text x="232" y="594" font-size="12" fill="#666666">telemetry / optional</text>
    <text x="1160" y="594" text-anchor="end" font-size="12" fill="#888888">Shadow mode is the default. AUTO routing is opt-in.</text>
  </g>
</svg>
