# Prebuilt-image stack for tagged BerrelEye releases.
# Usage:
#   cp .env.example .env   # set ENCRYPTION_KEY
#   docker compose -f docker-compose.release.yml up -d
# Pin a version with BERRELEYE_VERSION=v1.0.0 (defaults to latest).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: berreleye
      POSTGRES_PASSWORD: berreleye
      POSTGRES_DB: berreleye
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U berreleye"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    image: ghcr.io/cyberboynitin/berreleye-gateway:${BERRELEYE_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://berreleye:berreleye@postgres:5432/berreleye?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml-service:8001
      STORE: postgres
      SEED_DEMO: "${SEED_DEMO:-true}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  ml-service:
    image: ghcr.io/cyberboynitin/berreleye-ml-service:${BERRELEYE_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "8001:8001"

  web:
    image: ghcr.io/cyberboynitin/berreleye-web:${BERRELEYE_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      GATEWAY_INTERNAL_URL: http://gateway:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
